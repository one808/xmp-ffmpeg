name: Build xmp-ffmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        shell: powershell
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          Write-Host "VS Path: $vsPath"
          echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            make
            pkg-config

      - name: Download FFmpeg
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Configure FFmpeg
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/../ffmpeg-src"
          mkdir -p ffbuild && cd ffbuild
          export PATH="/c/msys64/usr/bin:$PATH"
          ../configure --toolchain=msvc --arch=x86 --target-os=win32 --enable-cross-compile --enable-static --disable-shared --disable-programs --disable-doc --disable-network --disable-everything --disable-avfilter --disable-avdevice --disable-swscale --disable-debug --disable-x86asm --enable-protocol=file --enable-demuxer=mp3,aac,ogg,flac,wav,aiff,ape,asf,matroska,mp4,mov,avi,dts,eac3,mlp,truehd,mpc,tta,wv,amr,pcm_s16le,pcm_f32le --enable-decoder=mp3,mp3float,aac,aac_latm,vorbis,opus,flac,wmav1,wmav2,ac3,eac3,dca,truehd,alac,ape,tta,wavpack,mpc7,mpc8,amrnb,amrwb,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f32be,pcm_f64le,pcm_f64be,pcm_u8,pcm_alaw,pcm_mulaw,adpcm_ima_qt,adpcm_ima_wav,adpcm_ms,adpcm_swf,adpcm_yamaha --enable-parser=mpegaudio,aac,ac3,dca,flac,vorbis,opus

      - name: Build FFmpeg
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          cd "%GITHUB_WORKSPACE%\..\ffmpeg-src\ffbuild"
          nmake

      - name: Prepare FFmpeg SDK
        shell: cmd
        run: |
          cd "%GITHUB_WORKSPACE%\.."
          mkdir ffmpeg\include\libavformat 2>nul
          mkdir ffmpeg\include\libavcodec 2>nul
          mkdir ffmpeg\include\libavutil 2>nul
          mkdir ffmpeg\include\libswresample 2>nul
          mkdir ffmpeg\lib 2>nul
          xcopy /y /q ffmpeg-src\libavformat\*.h ffmpeg\include\libavformat\
          xcopy /y /q ffmpeg-src\libavcodec\*.h ffmpeg\include\libavcodec\
          xcopy /y /q ffmpeg-src\libavutil\*.h ffmpeg\include\libavutil\
          xcopy /y /q ffmpeg-src\libswresample\*.h ffmpeg\include\libswresample\
          copy /y ffmpeg-src\ffbuild\config.h ffmpeg\include\
          copy /y ffmpeg-src\ffbuild\libavutil\avconfig.h ffmpeg\include\libavutil\
          copy /y ffmpeg-src\ffbuild\libavformat\avformat.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libavcodec\avcodec.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libavutil\avutil.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libswresample\swresample.lib ffmpeg\lib\

      - name: Build xmp-ffmpeg
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          msbuild xmp-ffmpeg.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmp-ffmpeg-win32-v141_xp
          path: Release/xmp-ffmpeg.dll
          retention-days: 30
