name: Build xmp-ffmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        shell: powershell
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          Write-Host "VS Path: $vsPath"
          echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-make
            mingw-w64-i686-pkg-config
            git
            base-devel

      - name: Download FFmpeg
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      - name: Build FFmpeg static libraries
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/../ffmpeg-src"
          mkdir -p ffbuild && cd ffbuild
          ../configure \
            --arch=x86 \
            --target-os=win32 \
            --enable-cross-compile \
            --enable-static \
            --disable-shared \
            --disable-programs \
            --disable-doc \
            --disable-network \
            --disable-everything \
            --disable-avfilter \
            --disable-avdevice \
            --disable-swscale \
            --disable-debug \
            --disable-x86asm \
            --disable-zlib \
            --enable-protocol=file \
            --enable-demuxer=mp3,aac,ogg,flac,wav,aiff,ape,asf,matroska,mp4,mov,avi,dts,eac3,mlp,truehd,mpc,tta,wv,amr,pcm_s16le,pcm_f32le \
            --enable-decoder=mp3,mp3float,aac,aac_latm,vorbis,opus,flac,wmav1,wmav2,ac3,eac3,dca,truehd,alac,ape,tta,wavpack,mpc7,mpc8,amrnb,amrwb,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f32be,pcm_f64le,pcm_f64be,pcm_u8,pcm_alaw,pcm_mulaw,adpcm_ima_qt,adpcm_ima_wav,adpcm_ms,adpcm_swf,adpcm_yamaha \
            --enable-parser=mpegaudio,aac,ac3,dca,flac,vorbis,opus
          make -j$(nproc)

      - name: Prepare FFmpeg SDK
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          mkdir -p ffmpeg/include/libavformat
          mkdir -p ffmpeg/include/libavcodec
          mkdir -p ffmpeg/include/libavutil
          mkdir -p ffmpeg/include/libswresample
          mkdir -p ffmpeg/lib

          cp -f ffmpeg-src/libavformat/*.h ffmpeg/include/libavformat/
          cp -f ffmpeg-src/libavcodec/*.h ffmpeg/include/libavcodec/
          cp -f ffmpeg-src/libavutil/*.h ffmpeg/include/libavutil/
          cp -f ffmpeg-src/libswresample/*.h ffmpeg/include/libswresample/
          cp -f ffmpeg-src/ffbuild/config.h ffmpeg/include/
          cp -f ffmpeg-src/ffbuild/libavutil/avconfig.h ffmpeg/include/libavutil/

          cp -f ffmpeg-src/ffbuild/libavformat/libavformat.a ffmpeg/lib/avformat.lib
          cp -f ffmpeg-src/ffbuild/libavcodec/libavcodec.a ffmpeg/lib/avcodec.lib
          cp -f ffmpeg-src/ffbuild/libavutil/libavutil.a ffmpeg/lib/avutil.lib
          cp -f ffmpeg-src/ffbuild/libswresample/libswresample.a ffmpeg/lib/swresample.lib

          # Copy MinGW runtime libraries
          ls -la /mingw32/lib/ | grep -E "lib(mingwex|msvcrt|gcc)\.a"
          cp -f /mingw32/lib/libmingwex.a ffmpeg/lib/ 2>/dev/null || echo "libmingwex.a not found at /mingw32/lib"
          cp -f /mingw32/lib/libmsvcrt.a ffmpeg/lib/ 2>/dev/null || echo "libmsvcrt.a not found at /mingw32/lib"
          cp -f /mingw32/lib/libgcc.a ffmpeg/lib/ 2>/dev/null || echo "libgcc.a not found at /mingw32/lib"
          # Try GCC lib directory
          cp -f /mingw32/lib/gcc/i686-w64-mingw32/*/libgcc.a ffmpeg/lib/ 2>/dev/null || echo "libgcc.a not found in GCC dir"
          ls -la ffmpeg/lib/

      - name: Build xmp-ffmpeg
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          msbuild xmp-ffmpeg.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /m

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmp-ffmpeg-win32-v141_xp
          path: Release/xmp-ffmpeg.dll
          retention-days: 30
