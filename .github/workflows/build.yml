name: Build xmp-ffmpeg

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install v141_xp toolset
        shell: powershell
        run: |
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -property installationPath
          Write-Host "VS Path: $vsPath"
          echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath $vsPath --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 --add Microsoft.VisualStudio.Component.WinXP --quiet --wait --norestart 2>$null

      - name: Download dependencies
        shell: cmd
        run: |
          curl -L -o ffmpeg-7.1.tar.gz https://ffmpeg.org/releases/ffmpeg-7.1.tar.gz
          curl -L -o xmp-sdk.zip https://www.un4seen.com/files/xmp-sdk.zip

      - name: Extract dependencies
        shell: cmd
        run: |
          tar xzf ffmpeg-7.1.tar.gz
          move ffmpeg-7.1 ffmpeg-src
          7z x xmp-sdk.zip -oxmp-sdk-tmp -y
          copy /y xmp-sdk-tmp\xmpin.h .
          copy /y xmp-sdk-tmp\xmpfunc.h .

      - name: Install MinGW & MSYS2
        shell: cmd
        run: |
          choco install msys2 -y --no-progress
          C:\msys64\usr\bin\bash --noprofile --norc -c "pacman -S --noconfirm make"

      - name: Build FFmpeg static libraries
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          where cl
          set MSYS_ROOT=C:\msys64
          set PATH=%MSYS_ROOT%\usr\bin;%PATH%
          cd ffmpeg-src
          if exist ffbuild rmdir /s /q ffbuild
          C:\msys64\usr\bin\bash --noprofile --norc -c "export PATH=/c/msys64/usr/bin:$PATH && export INCLUDE='%INCLUDE%' && export LIB='%LIB%' && export LIBPATH='%LIBPATH%' && cd /d/a/xmp-ffmpeg/xmp-ffmpeg/ffmpeg-src && mkdir -p ffbuild && cd ffbuild && ../configure --toolchain=msvc --arch=x86 --target-os=win32 --enable-cross-compile --enable-static --disable-shared --disable-programs --disable-doc --disable-network --disable-everything --disable-avfilter --disable-avdevice --disable-swscale --disable-debug --disable-x86asm --enable-protocol=file --enable-demuxer=mp3,aac,ogg,flac,wav,aiff,ape,asf,matroska,mp4,mov,avi,dts,eac3,mlp,truehd,mpc,tta,wv,amr,pcm_s16le,pcm_f32le --enable-decoder=mp3,mp3float,aac,aac_latm,vorbis,opus,flac,wmav1,wmav2,ac3,eac3,dca,truehd,alac,ape,tta,wavpack,mpc7,mpc8,amrnb,amrwb,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f32be,pcm_f64le,pcm_f64be,pcm_u8,pcm_alaw,pcm_mulaw,adpcm_ima_qt,adpcm_ima_wav,adpcm_ms,adpcm_swf,adpcm_yamaha --enable-parser=mpegaudio,aac,ac3,dca,flac,vorbis,opus"
          C:\msys64\usr\bin\bash --noprofile --norc -c "export PATH=/c/msys64/usr/bin:$PATH && cd /d/a/xmp-ffmpeg/xmp-ffmpeg/ffmpeg-src/ffbuild && make -j$(nproc)"

      - name: Prepare FFmpeg SDK
        shell: cmd
        run: |
          mkdir ffmpeg\include\libavformat
          mkdir ffmpeg\include\libavcodec
          mkdir ffmpeg\include\libavutil
          mkdir ffmpeg\include\libswresample
          mkdir ffmpeg\lib
          xcopy /y /q ffmpeg-src\libavformat\*.h ffmpeg\include\libavformat\
          xcopy /y /q ffmpeg-src\libavcodec\*.h ffmpeg\include\libavcodec\
          xcopy /y /q ffmpeg-src\libavutil\*.h ffmpeg\include\libavutil\
          xcopy /y /q ffmpeg-src\libswresample\*.h ffmpeg\include\libswresample\
          copy /y ffmpeg-src\ffbuild\config.h ffmpeg\include\
          copy /y ffmpeg-src\ffbuild\libavutil\avconfig.h ffmpeg\include\libavutil\
          copy /y ffmpeg-src\ffbuild\libavformat\avformat.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libavcodec\avcodec.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libavutil\avutil.lib ffmpeg\lib\
          copy /y ffmpeg-src\ffbuild\libswresample\swresample.lib ffmpeg\lib\

      - name: Build xmp-ffmpeg
        shell: cmd
        run: |
          call "%VS_PATH%\VC\Auxiliary\Build\vcvarsall.bat" x86
          msbuild xmp-ffmpeg.vcxproj /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v141_xp /m

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: xmp-ffmpeg-win32-v141_xp
          path: Release/xmp-ffmpeg.dll
          retention-days: 30
