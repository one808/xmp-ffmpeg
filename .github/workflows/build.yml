name: Build xmp-ffmpeg

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            mingw-w64-i686-gcc
            mingw-w64-i686-make
            git
            base-devel

      - name: Download FFmpeg 3.4.9
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          curl -L -o ffmpeg-3.4.9.tar.gz https://ffmpeg.org/releases/ffmpeg-3.4.9.tar.gz
          tar xzf ffmpeg-3.4.9.tar.gz
          mv ffmpeg-3.4.9 ffmpeg-src

      - name: Build FFmpeg 3.4
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/../ffmpeg-src"
          export CFLAGS="-Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration"
          ./configure --arch=x86 --target-os=win32 --enable-cross-compile --enable-static --disable-shared --disable-programs --disable-doc --disable-network --disable-everything --disable-avfilter --disable-avdevice --disable-swscale --disable-debug --disable-encoders --disable-bsfs --disable-x86asm --disable-asm --disable-inline-asm --disable-zlib --disable-iconv --enable-protocol=file --enable-demuxer=mp3,aac,ogg,flac,wav,aiff,ape,asf,matroska,mp4,mov,avi,dts,eac3,mlp,truehd,mpc,tta,wv,amr --enable-decoder=mp3,mp3float,aac,aac_latm,vorbis,opus,flac,wmav1,wmav2,ac3,eac3,dca,truehd,alac,ape,tta,wavpack,mpc7,mpc8,amrnb,amrwb,pcm_s16le,pcm_s16be,pcm_s24le,pcm_s32le,pcm_f32le,pcm_f32be,pcm_f64le,pcm_f64be,pcm_u8,pcm_alaw,pcm_mulaw,adpcm_ima_qt,adpcm_ima_wav,adpcm_ms,adpcm_swf,adpcm_yamaha --enable-parser=mpegaudio,aac,ac3,dca,flac,vorbis,opus
          make -j$(nproc)

      - name: Prepare SDK
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          mkdir -p ffmpeg/include/libavformat ffmpeg/include/libavcodec ffmpeg/include/libavutil ffmpeg/include/libswresample ffmpeg/lib
          cp ffmpeg-src/libavformat/*.h ffmpeg/include/libavformat/
          cp ffmpeg-src/libavcodec/*.h ffmpeg/include/libavcodec/
          cp ffmpeg-src/libavutil/*.h ffmpeg/include/libavutil/
          cp ffmpeg-src/libswresample/*.h ffmpeg/include/libswresample/
          cp ffmpeg-src/config.h ffmpeg/include/
          cp ffmpeg-src/libavutil/avconfig.h ffmpeg/include/libavutil/
          cp ffmpeg-src/libavformat/libavformat.a ffmpeg/lib/avformat.lib
          cp ffmpeg-src/libavcodec/libavcodec.a ffmpeg/lib/avcodec.lib
          cp ffmpeg-src/libavutil/libavutil.a ffmpeg/lib/avutil.lib
          cp ffmpeg-src/libswresample/libswresample.a ffmpeg/lib/swresample.lib
          cp /mingw32/lib/libgcc.a ffmpeg/lib/ 2>/dev/null || true

      - name: Build normal DLL
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="/mingw32/bin:$PATH"
          i686-w64-mingw32-g++ -shared -static -o xmp-ffmpeg.dll xmp-ffmpeg.cpp xmp-ffmpeg.def -I../ffmpeg/include -L../ffmpeg/lib -lavformat -lavcodec -lavutil -lswresample -Wl,--out-implib,xmp-ffmpeg.lib
          echo "=== Normal DLL built ==="
          ls -la xmp-ffmpeg.dll
          objdump -p xmp-ffmpeg.dll | grep -A 3 "Export Table"

      - name: Build debug DLL
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          export PATH="/mingw32/bin:$PATH"
          i686-w64-mingw32-g++ -shared -static -DXMP_FFMPEG_DEBUG_LOG -o xmp-ffmpeg-debug.dll xmp-ffmpeg.cpp xmp-ffmpeg.def -I../ffmpeg/include -L../ffmpeg/lib -lavformat -lavcodec -lavutil -lswresample -Wl,--out-implib,xmp-ffmpeg-debug.lib
          echo "=== Debug DLL built ==="
          ls -la xmp-ffmpeg-debug.dll
          objdump -p xmp-ffmpeg-debug.dll | grep -A 3 "Export Table"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xmp-ffmpeg-builds
          path: |
            xmp-ffmpeg.dll
            xmp-ffmpeg-debug.dll
          retention-days: 30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: xmp-ffmpeg v1.0.0 (FFmpeg 3.4.9)
          body: |
            ## XMPlay FFmpeg Audio Decoder Plugin v1.0.0

            Based on FFmpeg 3.4.9 for Windows XP compatibility.

            ### Supported Formats
            MP3, AAC, OGG, Opus, FLAC, WAV, APE, WMA, AC3, DTS, MPC, WV, TTA, TAK, ALAC, AMR, MP4, MKV, AVI, and more.

            ### Files
            - `xmp-ffmpeg.dll` - Normal release version
            - `xmp-ffmpeg-debug.dll` - Debug version with logging

            ### Installation
            Copy `xmp-ffmpeg.dll` to the XMPlay plugins directory.
          files: |
            xmp-ffmpeg.dll
            xmp-ffmpeg-debug.dll
          draft: false
